<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0D1117" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';">
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>HW Journal</title>
<style>
  @font-face { font-family: 'Vazirmatn'; src: local('Vazirmatn'); }
  :root[data-theme="dark"] {
    --bg: #0D1117; --panel: #141A22; --panel-alt: #1B222C; --border: #26303B; --border-soft: #1F2830;
    --text: #E8ECF2; --text-muted: #7E8899; --text-faint: #4E5866; --input-bg: #0D1117;
  }
  :root[data-theme="light"] {
    --bg: #F4F6F9; --panel: #FFFFFF; --panel-alt: #F0F2F6; --border: #D9DEE6; --border-soft: #E7EAF0;
    --text: #1B222C; --text-muted: #5B6472; --text-faint: #8C94A1; --input-bg: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    transition: background 0.2s, color 0.2s;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  ::selection { background: #3A2F1C; color: #D4A24C; }
  .mono { font-family: 'Consolas', 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  input, select, textarea, button { font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #D4A24C; outline-offset: 1px; }
  button:focus-visible { outline: 2px solid #D4A24C; outline-offset: 2px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  .card { background: var(--panel); border-radius: 14px; box-shadow: 0 0 0 1px var(--border), 0 8px 24px -8px rgba(0,0,0,0.35); }
  .tab-btn { background: none; border: none; color: var(--text-muted); padding: 10px 16px; cursor: pointer; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: #D4A24C; border-bottom: 2px solid #D4A24C; }
  .field { margin-bottom: 2px; }
  .field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 10px; color: var(--text); font-size: 13px;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: right; padding: 8px 10px; font-size: 11px; color: var(--text-faint); font-weight: 600; white-space: nowrap; }
  td { padding: 8px 10px; font-size: 12px; border-top: 1px solid var(--border-soft); white-space: nowrap; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.35s ease both; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 50; overflow-y: auto;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./app.js"></script>
<script src="./register-sw.js"></script>
</body>
</html>
